<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>本地题库演示页 · AI 学习助手</title>
    <style>
      body {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px 48px;
        font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2328;
      }
      h1 { font-size: 20px; }
      .hint { color: #8b949e; font-size: 13px; }
      .toolbar { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
      button { font: inherit; padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
      .quiz { display: flex; flex-direction: column; gap: 14px; }
      .question { border: 1px solid #eaeef2; border-radius: 10px; padding: 14px 16px; }
      .question-title { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
      .options { list-style: none; margin: 0; padding: 0; }
      .options li { padding: 4px 0; }
      .options label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
      .option-label { color: #57606a; }
      .blank-input { width: 160px; padding: 3px 6px; border: 1px solid #d0d7de; border-radius: 4px; font: inherit; }
      .note { color: #8b949e; font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>本地题库演示页</h1>
    <p class="hint">
      这是供扩展联调用的靶场，不是真实平台页面。结构故意做成常见的“容器 → 题干 → 选项”形态，
      并保留了单选、多选、填空三种题型。
    </p>

    <div class="toolbar">
      <button id="add" type="button">动态追加第 4 题</button>
      <button id="rerender" type="button">重新渲染整页</button>
      <button id="submit" type="button">提交作业（演示按钮，脚本不会点击）</button>
    </div>

    <div class="quiz" id="quiz">
      <section class="question" data-question-id="demo-q1">
        <h3 class="question-title">1. Java 中哪个关键字用于继承类？</h3>
        <ul class="options">
          <li>
            <label><input type="radio" name="demo-q1" /><span class="option-label">A.</span>implements</label>
          </li>
          <li>
            <label><input type="radio" name="demo-q1" /><span class="option-label">B.</span>extends</label>
          </li>
          <li>
            <label><input type="radio" name="demo-q1" /><span class="option-label">C.</span>instanceof</label>
          </li>
          <li>
            <label><input type="radio" name="demo-q1" /><span class="option-label">D.</span>super</label>
          </li>
        </ul>
      </section>

      <section class="question" data-question-id="demo-q2">
        <h3 class="question-title">2. 下列哪些属于 Java 集合框架的接口？（多选）</h3>
        <ul class="options">
          <li>
            <label><input type="checkbox" name="demo-q2" /><span class="option-label">A.</span>List</label>
          </li>
          <li>
            <label><input type="checkbox" name="demo-q2" /><span class="option-label">B.</span>HashMap</label>
          </li>
          <li>
            <label><input type="checkbox" name="demo-q2" /><span class="option-label">C.</span>Set</label>
          </li>
          <li>
            <label><input type="checkbox" name="demo-q2" /><span class="option-label">D.</span>Map</label>
          </li>
        </ul>
      </section>

      <section class="question" data-question-id="demo-q3">
        <h3 class="question-title">
          3. Java 程序的入口方法是 ____，它的返回类型是 ____。
        </h3>
        <p>
          <input class="blank-input" type="text" data-blank="0" />
          <input class="blank-input" type="text" data-blank="1" />
        </p>
        <p class="note">填空题：两个输入框，对应两个空。</p>
      </section>
    </div>

    <script>
      const quiz = document.getElementById('quiz');

      // 模拟“异步渲染”：新增题目后，扩展需要重新采集才能拿到新快照。
      document.getElementById('add').addEventListener('click', () => {
        if (document.getElementById('dynamic-q4')) return;
        const section = document.createElement('section');
        section.className = 'question';
        section.id = 'dynamic-q4';
        section.dataset.questionId = 'demo-q4';
        section.innerHTML = `
          <h3 class="question-title">4. 下列哪个不是 JVM 运行时数据区？</h3>
          <ul class="options">
            <li><label><input type="radio" name="demo-q4" /><span class="option-label">A.</span>方法区</label></li>
            <li><label><input type="radio" name="demo-q4" /><span class="option-label">B.</span>堆</label></li>
            <li><label><input type="radio" name="demo-q4" /><span class="option-label">C.</span>寄存器组</label></li>
            <li><label><input type="radio" name="demo-q4" /><span class="option-label">D.</span>程序计数器</label></li>
          </ul>
        `;
        quiz.append(section);
      });

      // 整页重渲染：用来验证“旧快照必须失效”这条规则。
      document.getElementById('rerender').addEventListener('click', () => {
        location.reload();
      });

      // 这个按钮只用于确认扩展确实没有自动提交行为。
      document.getElementById('submit').addEventListener('click', () => {
        alert('演示页面：提交按钮被点击了。扩展本身不会触发它。');
      });
    </script>
  </body>
</html>
